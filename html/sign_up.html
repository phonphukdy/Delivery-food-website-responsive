<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign up</title>
    <link rel="stylesheet" href="../css/sign_up.css">
</head>
<body>
    <div class="login_element">
        <div class="container">
            <div class="first_block">
                <div class="get_back_btn">
                    <!-- <p>get_back_btn</p> -->
                     <img src="../image/pngwing.com.png" alt="" class="pic">
                </div>
                <div class="welcomeback_container text">
                    <div class="welcomeback_text">
                        <p><b>Sign up
                        </b></p>
                    </div>
                    <div>
                        <p style="opacity: 0.3;">Create account and choose fravorite</p>
                    </div>
                </div>
                <div>
                    <div class="email_text text">
                        <p>Name</p>
                    </div>
                    <div class="email_field_container bg_field">
                        <div class="email_border">
                            <div class="email_field text_color text">
                                <p >Your name</p>
                            </div>
                        </di>
                    </div>
                </div>
                <div>
                    <div class="email_text text">
                        <p>Email</p>
                    </div>
                    <div class="email_field_container bg_field">
                        <div class="email_border">
                            <div class="email_field text_color text">
                                <p >Your email</p>
                            </div>
                        </di>
                    </div>
                </div>
                <div class="password_text">
                    <div class="password_text text">
                        <p>Password</p>
                    </div>
                    <div class="password_field_container bg_field">
                        <div class="password_border">
                            <div class="password_field text_color text">
                                <p>Your password</p>
                            </div>
                            <div class="eye_password_hide">
                                <img src="../image/eye-password-hide-svgrepo-com.png" alt="">
                            </div>
                        </div>
                    </div>
                </div>
                <div>
                    <div class="login_button">
                        <div class="inside_login_button text">
                            <a href="">Register</a>
                        </div>
                    </div>
                    <div class="dont_have_an_account_container">
                        <div style="opacity: 0.5;">
                            <p href="">have an account?</p>
                        </div>
                        <div>
                            <a href="" style="color: red;">Sign In</a>
                        </div>
                    </div>
                </div>
            </div>
            <div class="footer">
                <div style="opacity: 0.5;">
                    <p>By clicking Register, you agree to our</p>
                </div>
                <div style="margin-top: 2px; color: red;">
                    <p>Terms and Data Policy</p>
                </div>
            </div>
        </div>
        
    </div>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Food Delivery - Home</title>
    <link rel="stylesheet" href="../css/home.css">
</head>
<body>
    <div class="home-container">

        <!-- Header Section -->
        <header>
            <h2>Home</h2>
            <div class="icons">
                <span class="notification">🔔</span>
            </div>
        </header>

        <!-- Search Bar -->
        <div class="search-bar">
            <input type="text" placeholder="Search on Kupa">
        </div>

        <!-- Delivery Information -->
        <div class="delivery-info">
            <div class="delivery-text">
                <p>Delivery to Home</p>
                <small>Utama Street no. 14, Rumbai</small>
            </div>
            <div class="distance">
                <p>2.4 km</p>
            </div>
        </div>

        <!-- Featured Meal -->
        <div class="featured-meal">
            <img src="chicken_teriyaki.png" alt="Chicken Teriyaki">
            <div class="meal-info">
                <h3>Chicken Teriyaki</h3>
                <small>Discount 25%</small>
                <button>Order Now</button>
            </div>
        </div>

        <!-- Top of the Week Section -->
        <h3 class="section-title">Top of Week</h3>
        <div class="top-week">
            <div class="meal-item">
                <img src="dish1.png" alt="Hongkong Hainanese">
                <p>Hongkong Hainanese</p>
                <span>$14.99</span>
            </div>
            <div class="meal-item">
                <img src="dish2.png" alt="Hot & Sour Corn">
                <p>Hot & Sour Corn</p>
                <span>$20.99</span>
            </div>
            <div class="meal-item">
                <img src="dish3.png" alt="Singapura Hokkien">
                <p>Singapura Hokkien</p>
                <span>$24.99</span>
            </div>
        </div>

        <!-- Bottom Navigation -->
        <nav class="bottom-nav">
            <a href="#">🏠 Home</a>
            <a href="#">📄 Menu</a>
            <a href="#">🛒 Cart</a>
            <a href="#">👤 Profile</a>
        </nav>
    </div>
</body>
</html>

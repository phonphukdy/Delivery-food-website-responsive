<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password</title>
    <link rel="stylesheet" href="../css/forgot_password.css">
</head>
<body>
    <div class="forgot-password-container">
        <div class="back_btn">
            <img src="../image/pngwing.com.png" alt="">
        </div>
        <div class="text">
            <h2>Forgot Password</h2>
            <p style="line-height: 25px; opacity: 0.5;">Select which contact details should we use to reset your password</p>
        </div>
        
        <div class="option-container">
            <div class="option email">
                <div class="icon">
                    <!-- Email icon can be an actual image or font icon -->
                    📧
                </div>
                <div class="details text">
                    <p>Email</p>
                    <small>Send to your email</small>
                </div>
            </div>

            <div class="option phone">
                <div class="icon">
                    <!-- Phone icon -->
                    📞
                </div>
                <div class="details text">
                    <p>Phone Number</p>
                    <small>Send to your phone number</small>
                </div>
            </div>
        </div>
        
        <button class="btn-continue">Continue</button>
    </div>
</body>
</html>
